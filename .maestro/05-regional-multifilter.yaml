# Watchly journey 5: Movies -> Regional Cinema & Multi-Filter Studio -> Multi-Cinema + Genre -> Shows -> Home.
appId: com.watchly.app
---
- launchApp
- runFlow:
    when:
      visible: "Close app"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible: "Watchly"
    timeout: 60000
- tapOn: "Movies"
- extendedWaitUntil:
    visible: "Filters"
    timeout: 30000
- tapOn: "Filters"
- extendedWaitUntil:
    visible: "Multi-Filter Studio"
    timeout: 15000
- runFlow:
    when:
      visible: "Bollywood"
    commands:
      - tapOn: "Bollywood"
      - tapOn: "Hollywood"
- tapOn: "Reset"
- tapOn: "Close filters"
- runFlow:
    when:
      visible: "Action"
    commands:
      - tapOn: "Action"
- tapOn: "Shows"
- extendedWaitUntil:
    visible: "Filters"
    timeout: 20000
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Watchly"
    timeout: 20000
