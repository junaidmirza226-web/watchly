# =============================================================================
# Re-record Roborazzi screenshot goldens.
#
# The goldens in app/src/test/screenshots/ are the visual contract, but
# after an intentional UI change they go stale and the verify run fails.
# Re-recording rewrites them to match the current UI. NEVER use this to
# "fix" a failure you did not intend: read the golden diff in the
# Android Tests run first (the compare PNGs are uploaded as artifacts).
#
# Run manually from the Actions tab. It commits the re-recorded goldens
# back to main; that push re-runs the normal Android Tests gate, which
# verifies the new goldens and runs the emulator + Maestro journeys.
# =============================================================================

name: Re-record Screenshot Goldens

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

jobs:
  record-goldens:
    name: Record screenshot goldens
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Record mode rewrites src/test/screenshots/*.png to match the
      # current UI instead of failing on a mismatch. Only the screenshot
      # class runs here — the rest of the unit suite is gated by the
      # Android Tests workflow, and re-running 440 tests just to write
      # six PNGs burned past the job timeout last time.
      # continue-on-error keeps the commit step reachable even if an
      # unrelated test fails in the same task: the goldens are written
      # before any comparison happens.
      - name: Record goldens
        id: record
        continue-on-error: true
        run: |
          ./gradlew :app:testDebugUnitTest -ProborazziRecord --tests "com.watchly.app.ui.screenshots.WatchlyScreenshotTest" --stacktrace 2>&1 | tee gradle-record.log
          python3 - << 'PY'
          lines = open("gradle-record.log", errors="ignore").read().splitlines()
          errs = [l for l in lines if l.startswith("e: ") or "Exception" in l or "FAILED" in l]
          for e in errs[:20]:
              print(f"::warning title=RecordDiag::{e[:280]}")
          PY

      - name: Show what changed
        run: git status --porcelain app/src/test/screenshots/ || true

      - name: Commit re-recorded goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet app/src/test/screenshots/; then
            echo "No golden changes — nothing to commit."
          else
            git add app/src/test/screenshots/
            git commit -m "chore(test): re-record screenshot goldens after UI changes"
            git push
          fi
