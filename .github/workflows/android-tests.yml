# =============================================================================
# Watchly — Android Tests (GitHub Actions)
#
# IMPORTANT: GitHub only runs workflow files from .github/workflows/ at the
# repository root. Copy this file to:
#     .github/workflows/android-tests.yml
# It will NOT run from testing/github-actions/.
#
# What runs:
#   Job 1  unit-and-lint : JVM unit tests + Robolectric + Paparazzi verify
#                          + Android Lint. No emulator. Fast gate for every PR.
#   Job 2  emulator      : instrumented tests (app/src/androidTest) on an
#                          API 34 emulator, KVM-accelerated, on ubuntu-latest.
#                          Runs after Job 1 passes.
#
# Assumes: Gradle wrapper committed, module :app, JDK 17, no secrets needed
# for the debug build. See ../README.md for the full assumption list.
# =============================================================================

name: Android Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch: # allow manual runs from the Actions tab

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — JVM tests + lint (no emulator)
  # ---------------------------------------------------------------------------
  unit-and-lint:
    name: Unit tests, screenshots & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests (incl. Robolectric)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Paparazzi screenshot verification
        run: ./gradlew :app:verifyPaparazziDebug --stacktrace

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload test & lint reports
        if: always() # upload even (especially) when a step above failed
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/paparazzi/
            app/build/paparazzi/failures/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 2 — Instrumented tests on an emulator (KVM, Linux runner only)
  # ---------------------------------------------------------------------------
  emulator:
    name: Instrumented tests (emulator, API 34)
    needs: unit-and-lint
    runs-on: ubuntu-latest # KVM is available on GitHub's Linux runners, not macOS/Windows
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Without KVM the emulator crawls under software emulation and will
      # likely time out — this is the standard udev-rules step from the
      # android-emulator-runner docs.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD / emulator snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-x86_64-v1

      - name: Create AVD snapshot for cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD snapshot created."

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
