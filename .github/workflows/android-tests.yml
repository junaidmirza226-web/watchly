# =============================================================================
# Watchly — Android Tests (GitHub Actions)
#
# What runs:
#   Job 1  unit-and-lint : JVM unit tests + Robolectric + Roborazzi
#                          screenshot-golden verification + Android Lint.
#   Job 2  emulator      : instrumented tests (app/src/androidTest) on an
#                          API 34 Pixel 6 emulator (KVM-accelerated).
#   Job 3  maestro       : Maestro E2E phone journeys (01-05 blocking) on a
#                          parallel fresh API 34 Pixel 6 emulator (KVM).
# =============================================================================

name: Android Tests

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — JVM tests + Roborazzi goldens + Android Lint
  # ---------------------------------------------------------------------------
  unit-and-lint:
    name: Unit tests, screenshots & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests (incl. Robolectric + Roborazzi screenshots)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Emit JUnit & Lint Annotations
        if: always()
        run: |
          python3 - << 'PY'
          import glob, xml.etree.ElementTree as ET, os
          total = failed = 0
          for path in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              try:
                  root = ET.parse(path).getroot()
                  total += int(root.attrib.get("tests", 0))
                  failed += int(root.attrib.get("failures", 0)) + int(root.attrib.get("errors", 0))
                  for tc in root.findall("testcase"):
                      for f in list(tc.findall("failure")) + list(tc.findall("error")):
                          cls = tc.attrib.get("classname", "")
                          name = tc.attrib.get("name", "")
                          msg = (f.attrib.get("message") or (f.text or ""))[:320].replace("\n", " ")
                          print(f"::error title=UnitTestFailed::{cls}.{name} -> {msg}")
              except Exception as e:
                  print(f"::warning title=ParseWarn::{path}: {e}")
          print(f"::notice title=UnitTestSummary::Total={total} Failed={failed}")
          if os.path.exists("app/build/reports/lint-results-debug.xml"):
              lroot = ET.parse("app/build/reports/lint-results-debug.xml").getroot()
              errs = [i for i in lroot.findall("issue") if i.attrib.get("severity") == "Error"]
              print(f"::notice title=LintSummary::Errors={len(errs)}")
              for i in errs[:15]:
                  print(f"::error title=LintError::{i.attrib.get('id')}: {i.attrib.get('message','')[:250]}")
          PY

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/outputs/roborazzi/
            app/src/test/screenshots/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 2 — Instrumented tests on an API 34 Pixel 6 emulator (KVM)
  # ---------------------------------------------------------------------------
  emulator:
    name: Instrumented tests (emulator, API 34)
    needs: unit-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pre-assemble debug & androidTest APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Emit Emulator Annotations
        if: always()
        run: |
          python3 - << 'PY'
          import glob, xml.etree.ElementTree as ET
          itotal = ifailed = 0
          for path in sorted(glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml", recursive=True)):
              try:
                  root = ET.parse(path).getroot()
                  itotal += int(root.attrib.get("tests", 0))
                  ifailed += int(root.attrib.get("failures", 0)) + int(root.attrib.get("errors", 0))
                  for tc in root.findall("testcase"):
                      for f in list(tc.findall("failure")) + list(tc.findall("error")):
                          cls = tc.attrib.get("classname", "")
                          name = tc.attrib.get("name", "")
                          raw_msg = (f.attrib.get("message") or "").strip()
                          raw_txt = (f.text or "").strip()
                          msg = (raw_msg if raw_msg else raw_txt)[:420].replace("\n", " ")
                          print(f"::error title=InstrumentedTestFailed::{cls}.{name} -> {msg}")
              except Exception as e:
                  print(f"::warning title=ParseWarn::{path}: {e}")
          print(f"::notice title=InstrumentedTestSummary::Total={itotal} Failed={ifailed}")
          PY

  # ---------------------------------------------------------------------------
  # Job 3a — Maestro E2E Core Journeys (01-03 blocking, API 34 KVM)
  # ---------------------------------------------------------------------------
  maestro-core:
    name: Maestro E2E core journeys (01-03, API 34)
    needs: unit-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Maestro journeys (01-03 blocking)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            curl -Ls "https://get.maestro.mobile.dev" | bash
            mkdir -p maestro-results
            sleep 45
            $HOME/.maestro/bin/maestro test .maestro/01-home-details-play.yaml --format junit --output maestro-results/01-home-details-play.xml --debug-output maestro-results/01-debug || echo $? > maestro-results/01.exit
            $HOME/.maestro/bin/maestro test .maestro/02-downloads-pause-resume.yaml --format junit --output maestro-results/02-downloads-pause-resume.xml --debug-output maestro-results/02-debug || echo $? > maestro-results/02.exit
            $HOME/.maestro/bin/maestro test .maestro/03-create-list.yaml --format junit --output maestro-results/03-create-list.xml --debug-output maestro-results/03-debug || echo $? > maestro-results/03.exit
            FAILED=0; for f in 01 02 03; do if [ -f maestro-results/$f.exit ]; then echo "BLOCKING Maestro flow $f FAILED (exit $(cat maestro-results/$f.exit))"; FAILED=1; fi; done; if [ $FAILED -eq 1 ]; then echo "Maestro gate: FAILED"; exit 1; fi; echo "Maestro gate: flows 01-03 passed"

      - name: Emit Maestro Core Annotations
        if: always()
        run: |
          python3 - << 'PY'
          import glob, xml.etree.ElementTree as ET
          for mpath in sorted(glob.glob("maestro-results/*.xml")):
              try:
                  mroot = ET.parse(mpath).getroot()
                  for tc in mroot.iter("testcase"):
                      fe = tc.find("failure")
                      if fe is None:
                          fe = tc.find("error")
                      name = tc.attrib.get("name", mpath)
                      if fe is not None:
                          fmsg = ((fe.attrib.get("message") or "") + " " + (fe.text or "")).strip()[:450].replace("\n", " ")
                          print(f"::error title=MaestroFailed::{mpath} ({name}) -> {fmsg}")
                      else:
                          print(f"::notice title=MaestroPassed::{mpath} ({name})")
              except Exception as e:
                  print(f"::warning title=MaestroParse::{mpath}: {e}")
          PY

      - name: Upload Maestro core output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-journey-reports-core
          path: |
            maestro-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Job 3b — Maestro E2E Search, Navigation & Multi-Filter Studio (04-05 blocking)
  # ---------------------------------------------------------------------------
  maestro-discovery:
    name: Maestro E2E discovery & multi-filter (04-05, API 34)
    needs: unit-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Maestro journeys (04-05 blocking)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            curl -Ls "https://get.maestro.mobile.dev" | bash
            mkdir -p maestro-results
            sleep 45
            $HOME/.maestro/bin/maestro test .maestro/04-search-home-tab.yaml --format junit --output maestro-results/04-search-home-tab.xml --debug-output maestro-results/04-debug || echo $? > maestro-results/04.exit
            $HOME/.maestro/bin/maestro test .maestro/05-regional-multifilter.yaml --format junit --output maestro-results/05-regional-multifilter.xml --debug-output maestro-results/05-debug || echo $? > maestro-results/05.exit
            FAILED=0; for f in 04 05; do if [ -f maestro-results/$f.exit ]; then echo "BLOCKING Maestro flow $f FAILED (exit $(cat maestro-results/$f.exit))"; FAILED=1; fi; done; if [ $FAILED -eq 1 ]; then echo "Maestro gate: FAILED"; exit 1; fi; echo "Maestro gate: flows 04-05 passed"

      - name: Emit Maestro Discovery Annotations
        if: always()
        run: |
          python3 - << 'PY'
          import glob, xml.etree.ElementTree as ET
          for mpath in sorted(glob.glob("maestro-results/*.xml")):
              try:
                  mroot = ET.parse(mpath).getroot()
                  for tc in mroot.iter("testcase"):
                      fe = tc.find("failure")
                      if fe is None:
                          fe = tc.find("error")
                      name = tc.attrib.get("name", mpath)
                      if fe is not None:
                          fmsg = ((fe.attrib.get("message") or "") + " " + (fe.text or "")).strip()[:450].replace("\n", " ")
                          print(f"::error title=MaestroFailed::{mpath} ({name}) -> {fmsg}")
                      else:
                          print(f"::notice title=MaestroPassed::{mpath} ({name})")
              except Exception as e:
                  print(f"::warning title=MaestroParse::{mpath}: {e}")
          PY

      - name: Upload Maestro discovery output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-journey-reports-discovery
          path: |
            maestro-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
