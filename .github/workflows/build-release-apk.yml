name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Watchly APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Restore Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          # The signing key MUST be the same one every release, otherwise Android
          # refuses to install an update over an existing install (signature
          # mismatch / INSTALL_FAILED_UPDATE_INCOMPATIBLE). It lives in the repo
          # secrets, never in git. If the secret is missing we fail loudly
          # instead of silently minting a brand new key and shipping an APK the
          # user can never update.
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing. Refusing to build a release that could never be updated in place."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > signing/watchly.jks
          echo "Release keystore restored ($(stat -c%s signing/watchly.jks) bytes)."
          # The keystore's real alias is whatever the key generator chose;
          # the secret may not match it (a wrong alias fails every release
          # with "No key with alias found"). Discover it from the keystore
          # itself instead of trusting the secret, and export it so Gradle
          # signs with the same alias.
          KEY_ALIAS=$(keytool -list -v -keystore signing/watchly.jks -storepass "$RELEASE_KEYSTORE_PASSWORD" | sed -n 's/^Alias name: \(.*\)$/\1/p' | head -n 1)
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::Could not enumerate any alias in the release keystore."
            exit 1
          fi
          echo "Discovered keystore alias: $KEY_ALIAS"
          echo "RELEASE_KEYSTORE_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          keytool -list -keystore signing/watchly.jks -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | head -n 5

      - name: Build Release APK
        env:
          # Master API keys are injected from repo secrets at build time and
          # never live in the repository (add them under Settings → Secrets).
          MASTER_TMDB_KEY: ${{ secrets.MASTER_TMDB_KEY }}
          MASTER_OMDB_KEY: ${{ secrets.MASTER_OMDB_KEY }}
          MASTER_TRAKT_CLIENT_ID: ${{ secrets.MASTER_TRAKT_CLIENT_ID }}
          MASTER_OPENSUBTITLES_KEY: ${{ secrets.MASTER_OPENSUBTITLES_KEY }}
          MASTER_FANART_KEY: ${{ secrets.MASTER_FANART_KEY }}
        run: ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          # Select signed APK, explicitly ignoring any unsigned outputs
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" -not -name "*unsigned*" -not -name "*androidTest*" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Warning: No signed APK found, falling back to any APK..."
            APK_FILE=$(find app/build/outputs/apk -name "*.apk" -not -name "*androidTest*" | head -n 1)
          fi
          echo "Selected APK: $APK_FILE"
          cp "$APK_FILE" release-output/watchly.apk
          
          # Verify signature
          APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            echo "Verifying APK signature using $APKSIGNER..."
            $APKSIGNER verify --verbose release-output/watchly.apk || true
          fi
          ls -la release-output/

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watchly-apk
          path: release-output/watchly.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Watchly ${{ github.ref_name }}
          body: |
            ## Watchly v${{ github.ref_name }}

            ### Notes
            - Signed with the permanent release key, so this release installs
              directly over the previous one.
            - The app reads its own version from Android, so the update banner
              always matches the version that is actually installed.
          files: release-output/watchly.apk
          draft: false
          prerelease: false

  cloud-device-test:
    name: Cloud Android Test (${{ matrix.device }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: "Google Pixel 6 (API 33)"
            api: 33
            profile: "pixel_6"
            prefix: "pixel6"
          - device: "Samsung Galaxy S21 Profile (1080x2400, API 34)"
            api: 34
            profile: "pixel_6"
            prefix: "samsung_s21"
    steps:
      - name: Download APK from Build Job
        uses: actions/download-artifact@v4
        with:
          name: watchly-apk
          path: release-output

      - name: Free Runner Disk Space for Cloud Emulator
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk*
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Enable KVM Virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Cloud Simulator (${{ matrix.device }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p emulator-evidence
            echo "Installing signed APK on ${{ matrix.device }}..."
            adb install -r release-output/watchly.apk
            echo "Launching Watchly on ${{ matrix.device }}..."
            adb shell am start -n com.watchly.app/.MainActivity
            sleep 15
            echo "Taking Home screen screenshot on ${{ matrix.device }}..."
            adb exec-out screencap -p > emulator-evidence/${{ matrix.prefix }}_01_home.png
            echo "Testing navigation: tap Search..."
            adb shell input tap 980 150 || true
            sleep 5
            adb exec-out screencap -p > emulator-evidence/${{ matrix.prefix }}_02_search.png
            echo "Checking logcat for any fatal crashes..."
            adb logcat -d *:E | grep -i "FATAL EXCEPTION" || true
            echo "Testing finished successfully on ${{ matrix.device }}."

      - name: Upload Cloud Device Screenshots & Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-evidence-${{ matrix.prefix }}
          path: emulator-evidence/
